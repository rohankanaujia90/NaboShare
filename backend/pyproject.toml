[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "naboshare-backend"
version = "0.1.0"
description = "NaboShare API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.15,<2.0",
  "fastapi>=0.115,<1.0",
  "email-validator>=2.2,<3.0",
  "pwdlib[argon2]>=0.3,<1.0",
  "pyjwt>=2.10,<3.0",
  "pydantic-settings>=2.8,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "mypy>=1.15,<2.0",
  "pytest>=8.3,<9.0",
  "pytest-cov>=6.0,<7.0",
  "ruff>=0.11,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config --cov=app --cov-report=term-missing"

[tool.coverage.run]
branch = true
